name: Frame AI - Social upload

# Uploads whatever the web app planned for TODAY (Frame AI/Social/Days/<today>.json).
# Runs every 2 hours (cron is UTC). YouTube and Buffer posts are uploaded on the first run of the day and PUBLISHED by the
# platform at their time slot (slots are chosen by the backend, 10:00-22:00 in the timezone saved in social_config.json).
# YouTube stops by itself when the daily quota (limits.youtube_units, default 10000) is used up; the rest goes on after the reset.
# NOTE: a run must finish BEFORE the next one starts (TIME_BUDGET_MIN < cron gap), otherwise GitHub queues only one waiting
# run and silently drops the rest -> it looks like "runs only once a day".
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      ignore_time:
        description: "Upload today's planned items now (do not wait for their time slot)"
        type: boolean
        default: false
      dry_run:
        description: "Only list what is due, upload nothing"
        type: boolean
        default: false

concurrency:
  group: frame-ai-social
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-social.txt

      - name: System packages (ffmpeg, fonts, bidi)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libfribidi0

      - run: pip install -r requirements-social.txt

      - name: Upload planned posts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          IGNORE_TIME: ${{ inputs.ignore_time && '1' || '0' }}
          MAX_ITEMS: "10"
          TIME_BUDGET_MIN: "90"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then python social_runner.py --dry-run; else python social_runner.py; fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: social-build
          path: social_build/**/*.log
          if-no-files-found: ignore
