name: Frame AI - Social upload

# Uploads whatever the web app planned for TODAY (Frame AI/Social/Days/<today>.json).
# Runs every 2 hours (cron is UTC). An item goes out on the first run after its time slot (slots are chosen by the backend,
# 10:00-22:00 in the timezone saved in social_config.json).
# NOTE: a run must finish BEFORE the next one starts (TIME_BUDGET_MIN < cron gap), otherwise GitHub queues only one waiting
# run and silently drops the rest -> it looks like "runs only once a day".
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: frame-ai-social
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-social.txt

      - name: System packages (ffmpeg, fonts, bidi)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libfribidi0

      - run: pip install -r requirements-social.txt

      - name: Upload planned posts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MAX_ITEMS: "10"
          TIME_BUDGET_MIN: "90"
        run: python social_runner.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: social-build
          path: social_build/**/*.log
          if-no-files-found: ignore
